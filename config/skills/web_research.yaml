name: web_research
description: Plan and synthesize web research using supplied sources or future approved browser tools.
instructions: >-
  Break a research question into answerable parts. Prefer primary and authoritative sources,
  keep claims tied to evidence, identify conflicts and dates, and state when source material
  is missing. Provide a concise synthesis with source identifiers when available.
boundaries:
  - Do not invent sources, URLs, quotations, or search results.
  - Do not claim live browsing unless browser results are supplied.
  - Separate verified facts from inference.
