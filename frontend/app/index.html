<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1019" />
    <meta name="description" content="EIVA personal assistant workspace" />
    <title>EIVA — Personal assistant</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-frame">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#overview" aria-label="EIVA home">
          <span class="brand-mark"><span></span><span></span><span></span><span></span></span>
          <span class="brand-name">eiva<span>.</span></span>
        </a>
        <div class="workspace-label">YOUR WORKSPACE</div>
        <nav class="navigation" aria-label="Main navigation">
          <button class="nav-item active" data-page="overview"><span class="nav-icon">◫</span>Overview</button>
          <button class="nav-item" data-page="chat"><span class="nav-icon">◌</span>Chat<span class="nav-shortcut">⌘ 1</span></button>
          <button class="nav-item" data-page="tasks"><span class="nav-icon">◇</span>Tasks<span id="task-count" class="nav-count hidden">0</span></button>
          <div class="nav-divider"></div>
          <div class="workspace-label nav-section-label">WORKSPACE</div>
          <button class="nav-item" data-page="knowledge"><span class="nav-icon">▤</span>Knowledge</button>
          <button class="nav-item" data-page="memory"><span class="nav-icon">⌘</span>Memory</button>
          <button class="nav-item" data-page="vision"><span class="nav-icon">▧</span>Vision</button>
        </nav>
        <div class="sidebar-bottom">
          <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span>Settings</button>
          <div class="user-card"><div class="avatar">S</div><div class="user-meta"><strong>Local workspace</strong><span>Private instance</span></div><span class="user-menu">···</span></div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button id="menu-toggle" class="icon-button menu-toggle" aria-label="Open navigation">☰</button>
          <div class="breadcrumb"><span>Workspace</span><span class="crumb-slash">/</span><strong id="page-title">Overview</strong></div>
          <div class="topbar-right"><span class="connection"><i id="connection-dot"></i><span id="connection-label">Connecting</span></span><button class="icon-button" data-page="settings" aria-label="Settings">⚙</button></div>
        </header>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
        <section id="view" class="view" tabindex="-1"></section>
        <footer class="app-footer"><span><b class="footer-mark">✳</b> EIVA workspace</span><span id="footer-model">Groq · Local retrieval</span></footer>
      </main>
    </div>
    <script type="module" src="/app.js?v=provider-status-clarity-fix-2"></script>
  </body>
</html>
