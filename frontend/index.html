<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruby AI — Personal Assistant</title>
  <meta name="description" content="Ruby AI — a fast, modular personal AI chatbot powered by GroqCloud." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=voice-assistant-2" />
</head>
<body>
  <!-- ── Sidebar ─────────────────────────────────────────────── -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">💎</span>
        <span class="logo-text">Ruby AI</span>
      </div>
      <button id="new-chat-btn" class="btn-icon" title="New Chat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
    <div class="sidebar-nav">
      <div class="nav-label">Model</div>
      <div id="model-badge" class="model-badge">
        <span class="model-dot"></span>
        <span id="model-name">GPT-OSS 20B</span>
      </div>
      <label class="nav-label voice-label" for="voice-select">Spoken voice</label>
      <select id="voice-select" class="voice-select" aria-label="Spoken voice">
        <option value="troy">Troy · Male</option>
        <option value="austin">Austin · Male</option>
        <option value="daniel">Daniel · Male</option>
        <option value="autumn">Autumn · Female</option>
        <option value="diana">Diana · Female</option>
        <option value="hannah">Hannah · Female</option>
      </select>
    </div>
    <div class="sidebar-footer">
      <div id="status-indicator" class="status-indicator">
        <span class="status-dot status-unknown"></span>
        <span id="status-text">Connecting…</span>
      </div>
    </div>
  </aside>

  <!-- ── Main Chat Area ──────────────────────────────────────── -->
  <main id="main" class="main">
    <!-- Header -->
    <header class="chat-header">
      <button id="sidebar-toggle" class="btn-icon mobile-only" title="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h1 class="chat-title">Ruby AI</h1>
      <div class="header-actions">
        <button id="theme-toggle" class="btn-icon" title="Toggle theme">
          <svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </header>

    <!-- Messages -->
    <div id="messages" class="messages">
      <div class="welcome">
        <div class="welcome-icon">💎</div>
        <h2>Hey, I'm Ruby</h2>
        <p>Your personal AI assistant. Ask me anything.</p>
        <div class="quick-actions">
          <button class="quick-btn" data-prompt="Explain quantum computing in simple terms">✨ Explain quantum computing</button>
          <button class="quick-btn" data-prompt="Write a Python function to reverse a linked list">🐍 Python linked list</button>
          <button class="quick-btn" data-prompt="What are the best practices for REST API design?">🌐 REST API best practices</button>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="input-area">
      <div class="input-container">
        <textarea
          id="message-input"
          placeholder="Message Ruby…"
          rows="1"
          autofocus
        ></textarea>
        <button id="voice-btn" class="voice-btn" title="Start voice chat" aria-label="Start voice chat">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg>
        </button>
        <button id="send-btn" class="send-btn" title="Send" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="input-footer">
        <span class="footnote">Ruby uses <strong>GPT-OSS 20B</strong> on GroqCloud. Voice audio is sent to Groq for transcription; API usage may incur charges.</span>
        <span id="voice-status" class="voice-status" aria-live="polite">Tap the microphone to speak</span>
      </div>
    </div>
  </main>

  <script src="app.js?v=voice-assistant-2"></script>
</body>
</html>
